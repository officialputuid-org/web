      /* ─── Spinning Monet Blobs (PixelOS style) ─── */
      .blob {
        position: absolute;
        width: clamp(300px, 40vw, 550px);
        height: clamp(300px, 40vw, 550px);
        border-radius: 50%;
        opacity: 0.45;
        animation: spin 30s linear infinite;
        pointer-events: none;
        z-index: 0;
      }

      @media (prefers-color-scheme: light) {
        .blob { opacity: 0.35; }
      }

      /* Top-left — Yellow (Monetp-y) */
      .blob-1 {
        top: 0; left: 0;
        background: radial-gradient(circle, var(--blob-y) 0%, transparent 70%);
        transform: translate(-45%, -45%);
        animation-duration: 30s;
      }

      /* Top-right — Purple (Monetp-w) */
      .blob-2 {
        top: 0; right: 0;
        background: radial-gradient(circle, var(--blob-w) 0%, transparent 70%);
        transform: translate(60%, -22%);
        animation-duration: 30s;
        animation-direction: reverse;
      }

      /* Bottom-left — Blue (Monetp-b) */
      .blob-3 {
        bottom: 0; left: 0;
        background: radial-gradient(circle, var(--blob-b) 0%, transparent 70%);
        transform: translate(-45%, 45%);
        animation-duration: 30s;
      }

      /* Bottom-right — Teal (Monetp-t) */
      .blob-4 {
        bottom: 0; right: 0;
        background: radial-gradient(circle, var(--blob-t) 0%, transparent 70%);
        transform: translate(30%, 30%);
        animation-duration: 30s;
        animation-direction: reverse;
      }

      @keyframes spin {
        from { transform: rotate(0deg) scale(1); }

        to { transform: rotate(360deg) scale(1); }

        position: relative;
        z-index: 1;
